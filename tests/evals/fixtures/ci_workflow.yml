name: deploy
on: [pull_request]
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: greet
        run: echo "Building PR titled ${{ github.event.pull_request.title }}"
      - name: deploy
        env:
          API_KEY: "sk_live_abc123_hardcoded_secret_value"
        run: ./deploy.sh
